<header class="top">
  <button class="ibtn only-mobile" id="navToggle" aria-label="Open menu"><svg class="ic"><use href="#i-menu"/></svg></button>
  <a class="brand" href="index.html" title="Back to ASMH CarePortal">
    <img src="https://asmh.gov.mv/storage/images/logos/asmh_logo2.svg" alt="ASMH" class="brand-logo" onerror="this.remove()">
    <span class="brand-txt"><b>ASMH</b> CarePortal</span>
  </a>
  <span class="top-sep hide-mobile"></span>
  <span class="top-title hide-mobile">Duty Roster</span>
  <div class="top-r">
    <span class="mode-pill" id="modePill">Loading…</span>
    <div class="pop-wrap">
      <button class="ibtn" id="bellBtn" aria-label="Notifications"><svg class="ic"><use href="#i-bell"/></svg><span class="dot-badge" id="bellBadge" hidden></span></button>
      <div class="pop" id="bellPop" hidden></div>
    </div>
    <button class="ibtn hide-mobile" id="themeBtn" aria-label="Toggle dark mode"><svg class="ic"><use href="#i-moon"/></svg></button>
    <div class="pop-wrap">
      <button class="me-chip" id="meBtn"><span class="av" id="meAv">?</span><span class="me-txt hide-mobile"><b id="meName">…</b><small id="meRole"></small></span><svg class="ic sm hide-mobile"><use href="#i-down"/></svg></button>
      <div class="pop" id="mePop" hidden></div>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Roster navigation">
    <div class="side-sec">Workforce</div>
    <a class="nav" data-route="dashboard"><svg class="ic"><use href="#i-grid"/></svg>Dashboard</a>
    <a class="nav" data-route="roster"><svg class="ic"><use href="#i-cal"/></svg>Duty Roster</a>
    <a class="nav" data-route="my"><svg class="ic"><use href="#i-user"/></svg>My Roster<span class="nbadge" id="nbMy" hidden></span></a>
    <a class="nav" data-route="staff"><svg class="ic"><use href="#i-users"/></svg>Staff Directory</a>
    <a class="nav" data-route="requests"><svg class="ic"><use href="#i-inbox"/></svg>Requests<span class="nbadge" id="nbReq" hidden></span></a>
    <a class="nav" data-route="reports"><svg class="ic"><use href="#i-chart"/></svg>Reports</a>
    <div class="side-sec admin-only">Administration</div>
    <a class="nav admin-only" data-route="activity"><svg class="ic"><use href="#i-history"/></svg>Versions &amp; Audit</a>
    <a class="nav admin-only" data-route="settings"><svg class="ic"><use href="#i-gear"/></svg>Settings</a>
    <div class="side-foot">
      <a class="nav" href="index.html"><svg class="ic"><use href="#i-home"/></svg>Back to CarePortal</a>
      <p id="sideFoot"></p>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main" tabindex="-1">
    <div class="boot">Loading duty roster…</div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="roster-app.js"></script>

</html>
